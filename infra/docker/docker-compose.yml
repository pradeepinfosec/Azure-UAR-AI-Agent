version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: azure_uar_mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: azure_uar_db
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
    driver: local
